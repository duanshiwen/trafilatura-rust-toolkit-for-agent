[workspace]
members = [".", "crates/trafilatura-ffi"]
resolver = "2"

[package]
name = "trafilatura-rust-for-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["诗闻 <opensource@example.com>"]
description = "Rust library for extracting main text and metadata from web pages, inspired by Trafilatura and designed for MCP workflows."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/your-org/trafilatura-rust-for-mcp"
homepage = "https://github.com/your-org/trafilatura-rust-for-mcp"
documentation = "https://docs.rs/trafilatura-rust-for-mcp"
keywords = ["html", "extraction", "scraping", "metadata", "mcp"]
categories = ["text-processing", "web-programming", "parser-implementations"]
exclude = ["target/", ".DS_Store"]

[lib]
name = "trafilatura_rust_for_mcp"
path = "src/lib.rs"

[features]
default = ["download"]
download = ["dep:reqwest", "dep:tokio"]

[dependencies]
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
once_cell = "1.19"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "charset", "http2"], optional = true }
scraper = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt", "macros"], optional = true }
url = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
tokio = { version = "1.37", features = ["rt", "macros"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
