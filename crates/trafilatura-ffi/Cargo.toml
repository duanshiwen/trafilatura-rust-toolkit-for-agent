[package]
name = "trafilatura-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "C ABI bridge for using trafilatura-rust-for-mcp from Swift/macOS clients."
license = "Apache-2.0"

[lib]
name = "trafilatura_ffi"
crate-type = ["staticlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trafilatura-rust-for-mcp = { path = "../..", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
missing_safety_doc = "warn"
